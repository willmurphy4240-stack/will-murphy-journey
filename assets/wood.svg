<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.085" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.33  0 0 0 0 0.19  0 0 0 0 0.07  0 0 0 0.6 0"/>
    </filter>
    <filter id="fine" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.18  0 0 0 0 0.06  0 0 0 0.12 0"/>
    </filter>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4DC" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#FFF4DC" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A1606" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#B9874F"/>
  <rect y="0" width="1600" height="200" fill="#C4925A"/>
  <rect y="200" width="1600" height="200" fill="#B5814B"/>
  <rect y="400" width="1600" height="200" fill="#C08D55"/>
  <rect y="600" width="1600" height="200" fill="#B07C46"/>
  <rect y="800" width="1600" height="200" fill="#BC8951"/>
  <rect width="1600" height="1000" filter="url(#grain)"/>
  <rect width="1600" height="1000" filter="url(#fine)"/>
  <g stroke="#5E3A1C" stroke-opacity=".5" stroke-width="2.5">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="610" y1="0" x2="610" y2="200"/>
    <line x1="1340" y1="200" x2="1340" y2="400"/>
    <line x1="260" y1="200" x2="260" y2="400"/>
    <line x1="980" y1="400" x2="980" y2="600"/>
    <line x1="470" y1="600" x2="470" y2="800"/>
    <line x1="1180" y1="800" x2="1180" y2="1000"/>
  </g>
  <rect width="1600" height="1000" fill="url(#light)"/>
</svg>
